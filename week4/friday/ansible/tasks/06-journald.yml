---
- name: Ensure persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Restart journald

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure persistent, size-capped journal
  ansible.builtin.template:
    src: journald-kijanikiosk.conf.j2
    dest: /etc/systemd/journald.conf.d/00-journal-size.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
