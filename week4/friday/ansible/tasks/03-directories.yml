---
- name: Create KijaniKiosk directory tree with owners and modes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ kk_directories }}"
  loop_control:
    label: "{{ item.path }}"

# Week 3: new files in shared/logs inherit group rwx so kk-logs and logrotate
# can work with logs written by any service account.
- name: Grant the application group access to shared logs
  ansible.posix.acl:
    path: "{{ kk_shared_logs_dir }}"
    entity: "{{ kk_group }}"
    etype: group
    permissions: rwx
    state: present

- name: Make new files in shared logs inherit the group access (default ACL)
  ansible.posix.acl:
    path: "{{ kk_shared_logs_dir }}"
    entity: "{{ kk_group }}"
    etype: group
    permissions: rwx
    default: true
    state: present
