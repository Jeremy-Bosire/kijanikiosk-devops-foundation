[defaults]
inventory = inventory.ini
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
nocows = 1
interpreter_python = /usr/bin/python3
forks = 5
# Small (512 MB) VMs under load can take >12s to answer sudo; give SSH and sudo 60s.
timeout = 60

[ssh_connection]
pipelining = True
# known_hosts.generated is written by pipeline.sh (ssh-keyscan) every run, so
# strict host key checking stays ON even though VMs are recreated with new keys.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=known_hosts.generated -o StrictHostKeyChecking=yes
